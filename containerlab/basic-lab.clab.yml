name: basic-lab

topology:
  defaults:
    kind: linux
    image: clab-ubuntu-softnet:latest

  nodes:
    hs1:
      binds:
        - configs/hs1.cfg:/etc/nodes/hs1.cfg:ro
        - bin/entrypoint.sh:/entrypoint.sh:ro
      exec:
        - bash /entrypoint.sh
       
         hs2:
      binds:
        - configs/hs2.cfg:/etc/nodes/hs2.cfg:ro
        - bin/entrypoint.sh:/entrypoint.sh:ro
      exec:
        - bash /entrypoint.sh

    rt2:
      binds:
        - configs/rt2.cfg:/etc/nodes/rt2.cfg:ro
        - bin/entrypoint.sh:/entrypoint.sh:ro
      exec:
        - bash /entrypoint.sh

  links:
    - endpoints:
        - hs1:eth1
        - rt1:eth1
    - endpoints:
        - hs2:eth2
        - rt1:eth1
